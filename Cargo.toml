[package]
name = "resolve"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Turn discipline into something visible and measurable."
license = "MIT"
repository = "https://github.com/0rtizSys/Resolve"
readme = "README.md"
keywords = ["productivity", "discipline", "tasks", "desktop"]
categories = ["gui"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.37"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
